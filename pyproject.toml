[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mineria-textos-esperanto"
version = "0.1.0"
description = "Procesamiento y clasificación de textos científicos en Esperanto"
requires-python = ">=3.11"

[project.optional-dependencies]
proyecto = [
    "beautifulsoup4==4.14.3",
    "matplotlib==3.10.8",
    "pandas==2.2.3",
    "scikit-learn==1.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
